name: تشغيل مولد الألغاز

# متى يُشغل؟
on:
  # 1. تشغيل يدوي من تبويب Actions (زر Run workflow)
  workflow_dispatch:

  # 2. (اختياري) تشغيل تلقائي كل أسبوع، مثلاً كل يوم أحد
  schedule:
    - cron: '0 0 * * 0'

jobs:
  generate-puzzles:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل كود المستودع (ليجد ملف main.py)
      - name: تحميل الكود
        uses: actions/checkout@v4

      # 2. تجهيز بايثون
      - name: تجهيز بايثون 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت المكتبة المطلوبة (google-genai)
      - name: تثبيت المتطلبات
        run: |
          pip install google-genai

      # 4. تشغيل السكريبت مع تمرير مفتاح API السري
      - name: تشغيل main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 5. رفع الملف الناتج لتنزيله (Artifact)
      - name: رفع الملف المضغوط
        uses: actions/upload-artifact@v4
        with:
          name: ملف-الألغاز-الناتج
          path: unique_word_puzzles_50k.json.gz
